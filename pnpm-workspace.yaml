# pnpm 12: dependency build scripts must be explicitly reviewed.
# Unreviewed scripts fail install with ERR_PNPM_IGNORED_BUILDS.
# `packages` is required when Vercel falls back to older pnpm.
packages:
  - '.'

allowBuilds:
  '@vercel/speed-insights': true
  core-js: true
  # `pnpm` (direct dep) ships pre/postinstall that fetch its platform binary;
  # not needed at build/runtime (Vercel uses packageManager via corepack).
  pnpm: false
